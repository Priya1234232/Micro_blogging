<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroBlog</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>MicroBlog</h1>

    <nav>
        <button onclick="showHome()">Home</button>
        <button onclick="showProfile('priya')">My Profile</button>
    </nav>
</header>

<main>

    <!-- HOME PAGE -->
    <section id="homePage">

        <div class="create-post">
            <h2>Create Post</h2>

            <textarea id="postText"
                placeholder="What's happening?"></textarea>

            <button onclick="createPost()">Post</button>
        </div>

        <h2>People</h2>

        <div id="usersList" class="users"></div>

        <h2>Recent Posts</h2>

        <div id="postsList"></div>

    </section>


    <!-- PROFILE PAGE -->
    <section id="profilePage" class="hidden">

        <button class="back" onclick="showHome()">← Back</button>

        <div class="profile-card">

            <div class="avatar" id="profileAvatar"></div>

            <h2 id="profileName"></h2>
            <p id="profileUsername"></p>

            <p id="profileBio"></p>

            <div class="stats">

                <div>
                    <b id="profilePosts">0</b>
                    <span>Posts</span>
                </div>

                <div>
                    <b id="profileFollowers">0</b>
                    <span>Followers</span>
                </div>

                <div>
                    <b id="profileFollowing">0</b>
                    <span>Following</span>
                </div>

            </div>

            <button id="followButton"></button>

        </div>


        <div class="profile-content">

            <div>
                <h2>Posts</h2>
                <div id="profilePostsList"></div>
            </div>

            <div>
                <h2>Followers</h2>
                <div id="followersList"></div>
            </div>

        </div>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
